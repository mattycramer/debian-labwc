[main]
term=foot
app-id=foot
font=Noto Sans Mono:pixelsize=10
font-bold=Noto Sans Mono:pixelsize=10
dpi-aware=yes
initial-color-theme=dark
box-drawings-uses-font-glyphs=no
initial-window-size-pixels=960x620
pad=12x12 center
resize-by-cells=yes
selection-target=both
bold-text-in-bright=no

[bell]
system=no

[scrollback]
lines=120000

[cursor]
style=beam
unfocused-style=hollow
blink=yes
blink-rate=600
beam-thickness=1px

[mouse]
hide-when-typing=yes

[text-bindings]
\x1b[1;3A = Mod1+Up
\x1b[1;3B = Mod1+Down
\x1b[1;3C = Mod1+Right
\x1b[1;3D = Mod1+Left

