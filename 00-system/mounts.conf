# source|where|type|options|timeout|owner|group|mode
#
# Top-level paths are installed as systemd automounts so they are available for
# hot-plug, on-demand activation without boot-time mounting. Nested paths are
# pulled in by the parent mount when that subtree is first accessed.
# Ownership fixup services run after each real mount and apply the declared
# owner, group, and mode to the mounted subvolume root.

# Torrents subvolumes (btrfs)
LABEL=torrents|/data/mnt/g-drive/torrents|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents|15s|torrent|torrent|2770
LABEL=torrents|/data/mnt/g-drive/torrents/complete|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents_complete|15s|torrent|torrent|2770
LABEL=torrents|/data/mnt/g-drive/torrents/temp|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents_temp|15s|torrent|torrent|2770

