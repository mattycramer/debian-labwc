# source|where|type|options|timeout
#
# Top-level paths are installed as systemd automounts so they are available for
# hot-plug, on-demand activation without boot-time mounting. Nested paths are
# pulled in by the parent mount when that subtree is first accessed.

# Torrents subvolumes (btrfs)
LABEL=torrents|/data/mnt/g-drive/torrents|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents|15s
LABEL=torrents|/data/mnt/g-drive/torrents/complete|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents_complete|15s
LABEL=torrents|/data/mnt/g-drive/torrents/temp|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents_temp|15s

# Storage subvolumes (btrfs)
LABEL=storage|/data/mnt/g-drive/storage|btrfs|rw,relatime,lazytime,compress=zstd:1,space_cache=v2,nodiscard,nodev,nosuid,subvol=@storage|15s

# Backup subvolumes (btrfs)
LABEL=backup|/data/mnt/g-drive/backup|btrfs|rw,relatime,lazytime,compress=zstd:1,space_cache=v2,nodiscard,nodev,nosuid,subvol=@backup|15s
LABEL=backup|/data/mnt/g-drive/backup/system|btrfs|rw,relatime,lazytime,compress=zstd:1,space_cache=v2,nodiscard,nodev,nosuid,noexec,subvol=@backup_system|15s
LABEL=backup|/data/mnt/g-drive/backup/user|btrfs|rw,relatime,lazytime,compress=zstd:1,space_cache=v2,nodiscard,nodev,nosuid,noexec,subvol=@backup_user|15s

