# source|where|type|options|timeout|owner|group|mode
#
# Only top-level g-drive subvolumes are managed here. Nested subvolume
# mounts are intentionally unsupported because they created brittle dependency
# chains when the drive was absent.
#
# The generated units keep the real mount inactive until the backing device
# label is actually present. When the disk is absent, these paths remain plain
# directories instead of triggering dependency failures or failing mount attempts.

LABEL=torrents|/data/mnt/g-drive/torrents|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,noexec,nodatacow,subvol=@torrents|5s|torrent|torrent|2770
LABEL=storage|/data/mnt/g-drive/storage|btrfs|rw,relatime,lazytime,compress=zstd:1,space_cache=v2,nodiscard,nodev,nosuid,subvol=@storage|5s|invoke|invoke|0750
LABEL=apps|/data/mnt/g-drive/apps|btrfs|rw,noatime,lazytime,compress=none,space_cache=v2,nodiscard,nodev,nosuid,subvol=@apps|5s|invoke|invoke|0750
LABEL=priv|/data/mnt/g-drive/priv|btrfs|rw,relatime,lazytime,compress=zstd:1,space_cache=v2,nodiscard,nodev,nosuid,noexec,subvol=@priv|5s|invoke|invoke|0750
