# Managed locally. Copy this contract to /etc/labwc-secure-boot/modules.conf.
#
# Supported keys:
#   AUTO_CUSTOM_DKMS=yes|no
#     yes: automatically manage DKMS modules whose source trees are not owned by dpkg
#     no: manage only DKMS modules explicitly listed with DKMS_ALLOW
#
#   DKMS_ALLOW=<module>
#   DKMS_ALLOW=<module>/<version>
#     explicitly manage a DKMS module, even if its source tree is package-managed
#
#   MODULE_GLOB=/absolute/path/with/$kernelver/*.ko*
#     sign non-DKMS modules matching this absolute glob for each installed kernel
#
# Notes:
# - `$kernelver` is replaced with the target kernel version before glob expansion
# - module paths may be `.ko`, `.ko.gz`, `.ko.xz`, or `.ko.zst`
# - no shell code is executed from this file

AUTO_CUSTOM_DKMS=yes
